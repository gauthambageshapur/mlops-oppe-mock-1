name: ci
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Authenticate to GCP for DVC
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > "$RUNNER_TEMP/key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/key.json" >> "$GITHUB_ENV"

      - name: Fetch test data with DVC
        run: dvc pull data/test.csv.dvc

      - name: Evaluate model on fetched test data
        run: python evaluate.py

      - name: Verify inference script with pytest
        run: pytest -q

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics
          path: results/ci_metrics.json
